<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Hallucination Detector</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 720px;
        padding: 32px;
      }
      code {
        background: #e2e8f0;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RAG Hallucination Detector</h1>
      <p>
        The main demo UI for this project lives in <code>dashboard/app.py</code> and talks to the
        FastAPI backend in <code>backend/app.py</code>.
      </p>
      <p>Start the API with <code>uvicorn backend.app:app --reload</code>.</p>
      <p>Start the dashboard with <code>streamlit run dashboard/app.py</code>.</p>
    </main>
  </body>
</html>
